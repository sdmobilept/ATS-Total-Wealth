# Refreshes Zillow + FRED data monthly (Zillow publishes mid-month) and commits the new shards.
# The backtest is re-run quarterly-ish by hand (npm run data:backtest) since defaults change slowly.
name: Refresh market data

on:
  schedule:
    - cron: "0 12 20 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run data:refresh
      - run: npm test
      - name: Commit updated data
        run: |
          git config user.name "data-refresh-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/data data/reports
          git diff --cached --quiet || git commit -m "Refresh market data"
          git push
